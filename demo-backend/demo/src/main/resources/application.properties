spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
# Base64 encoded secret, replace in production
jwt.secret=d2VsbG5lc3MtbWFya2V0cGxhY2Utc2VjcmV0LWtlLWZvci1qd3QtYXV0aGVudGljYXRpb24tMjAyNi1zZWN1cmUta2V5
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# NPI Registry (Public API)
npi.api.base-url=https://npiregistry.cms.hhs.gov/api/

# ── Email / Session Reminder ─────────────────────────────────────────────────
# Replace with your Gmail address and an App Password
# (Google Account → Security → 2-Step Verification → App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# How many hours before a session should the reminder fire? (default: 24)
app.reminder.hours-before=24
# Cron: run the reminder check every hour  (sec min hr day month weekday)
app.reminder.cron=0 0 * * * *
# Enable detailed error messages in responses
server.error.include-message=always
